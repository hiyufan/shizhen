[project]
name = "parse-video-py"
version = "0.1.0"
description = "拾帧：抖音 / 小红书 / 快手 / YouTube / X 等平台视频图片提取，一键转 GIF 与实况照片（基于 parse-video-py）"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "aiohttp>=3.9",
    "fake-useragent>=1.5",
    "lxml>=5.0",
    "parsel>=1.9",
    "httpx>=0.27",
    "jmespath>=1.0",
    "pyyaml>=6.0",
    "yt-dlp[default]>=2025.1.1",
    "piexif>=1.1.3",
    "Pillow>=10",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "cryptography>=42",        # 反馈邮箱 AES-256-GCM 加密存储
    "fastapi-mcp>=0.4",
    "mcp>=1.12.0,<2.0.0",
]
cli = [
    "typer>=0.12",
    "rich>=13.0",
]
youtube = [
    "bgutil-ytdlp-pot-provider>=1.0",
]
douyin = [
    # 抖音图文兜底解析：无痕 Chromium 渲染 PC 版页面（见 douyin.py _note_via_browser）
    "playwright>=1.45",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.2",
    "ruff>=0.15",              # 格式化 + 静态检查（代替 black / isort / flake8），配置见下面 [tool.ruff]
    "pre-commit>=3.7",
    "fonttools[woff]>=4.50",   # 衬线字体子集：scripts/subset_fonts.py 和 tests/test_fonts.py
]
all = ["parse-video-py[web,cli,youtube,douyin]"]

[project.scripts]
parse-video-py = "parse_video_py.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parse_video_py"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]
extend-exclude = [".codegraph"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle / pyflakes
    "I",             # import 排序
    "B",             # 常见 bug 写法
    "UP",            # 新语法（X | None、内置泛型）
    "SIM", "C4",     # 能写简单就别绕
    "RET",           # return 写法
    "C90",           # 圈复杂度
    "PLR0911", "PLR0912", "PLR0915",   # 一个函数里 return / 分支 / 语句太多
    "PLW0603",       # 改模块级全局变量
]

[tool.ruff.lint.per-file-ignores]
# 页面文案表：一段文案一行，按行宽切开反而不好搜、不好改
"src/parse_video_py/seo.py" = ["E501"]
"src/parse_video_py/guides.py" = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-returns = 8

[tool.ruff.lint.flake8-bugbear]
# FastAPI 的依赖注入就是写在参数默认值里的
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Query", "typer.Argument", "typer.Option"]

[tool.ruff.lint.isort]
known-first-party = ["parse_video_py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
