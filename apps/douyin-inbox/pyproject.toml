[project]
name = "qiuyuantu-inbox"
version = "0.1.0"
description = "求原图普通抖音账号助手：私信收件、媒体解析与 GIF / LIVE 回传"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "qiuyuantu>=0.1.0",
    "playwright>=1.45",
]

[project.scripts]
qiuyuantu-inbox = "qiuyuantu_inbox.__main__:main"
qiuyuantu-account = "qiuyuantu_inbox.account:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qiuyuantu_inbox"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
