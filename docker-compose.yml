# 一台机器上的完整部署：Caddy 自动申请 HTTPS 证书并反代到应用
# 用法：把 DOMAIN 换成你的域名（DNS 先指到这台机器），然后 docker compose up -d
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PARSE_VIDEO_TRUST_PROXY: "1"
      # 代理链接签名密钥；不填会自动生成到 data/secret.key（多实例部署时必须填成同一个）
      PARSE_VIDEO_SECRET: ${PARSE_VIDEO_SECRET:-}
      # 并发 ffmpeg 数，建议 = CPU 核数 - 1
      PARSE_VIDEO_MAX_JOBS: "3"
      # data/ 目录配额（字节），默认 8GB
      PARSE_VIDEO_DISK_QUOTA: "8589934592"
      # 海外服务器必看：小红书 / B站 对海外 IP 不友好，给国内平台单独配一个国内出口
      # PARSE_VIDEO_PROXY_CN: "http://user:pass@host:port"
      # 没有国内机器时，用阿里云 ESA 边缘函数中继（见 scripts/esa-relay.js）
      # PARSE_VIDEO_RELAY_CN: "https://<函数域名>/relay"
      # PARSE_VIDEO_RELAY_TOKEN: "<和 esa-relay.js 里 TOKEN 一致>"
      # 或者贴登录后的 Cookie
      # PARSE_VIDEO_XHS_COOKIE: "a1=...; web_session=...; ..."
      # PARSE_VIDEO_BILI_COOKIE: "SESSDATA=...; buvid3=...; ..."
      # 所有平台都走的代理（可选）
      # PARSE_VIDEO_PROXY: "http://user:pass@host:port"
      # 站长统计页：设了就记录，打开 https://域名/stats?token=<它> 看每小时 / 每天多少人在用
      # PARSE_VIDEO_STATS_TOKEN: "换成一串随机字符"
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        limits:
          # 应用本身常驻约 20 MB，余量留给 ffmpeg 转换
          memory: 2g

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
