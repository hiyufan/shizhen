[[page.faq]]
q = "实况照片的封面能自己选吗？"
a = "能。转换面板里拖\"封面帧\"，或者把预览播到想要的画面点\"用当前画面做封面\"。"
[[page.faq]]
q = "为什么 iPhone 不能直接保存实况？"
a = "网页没有权限往 iOS 相册写入配对的实况。zip 里的 JPG 和 MOV 已经配好对，用支持合成实况的 App 或快捷指令导入即可，相册会显示为一张实况。"
[[page.body]]
title = "两种输出"
html = "iPhone 实况照片：一对 JPG + MOV，写入相同的 Apple 内容标识，打包成 zip；导入相册后长按会动，可设为锁屏动态壁纸。安卓动态照片：一张内嵌 MP4 的 JPG（MVIMG_ 开头），存到相册即可，Google 相册、三星、小米、OPPO、vivo 都识别。"
[[page.body]]
title = "从哪里来的视频都行"
html = "抖音、小红书、YouTube 等链接解析后点「做成实况照片」；本地视频点右上角上传。小红书和抖音图集里自带的实况图不用裁剪，解析后直接「实况原样打包」。"
